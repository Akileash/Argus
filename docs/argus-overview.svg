<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Argus system overview: sensors on the hard hat feed detection, which buzzes the wearer and uploads events to the cloud, where AI drafts a report that a safety manager reviews and signs off on the dashboard.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b3f46"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9480f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .zone { font-size: 13px; font-weight: 600; letter-spacing: 1.4px; fill: #656d76; }
      .t { font-size: 16px; font-weight: 600; }
      .s { font-size: 13.5px; fill: #57606a; }
      .l { font-size: 12.5px; fill: #57606a; }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
      .key { fill: #fff4ec; stroke: #d9480f; stroke-width: 1.4; }
      .area { fill: #f6f8fa; }
      .f { fill: none; stroke: #3b3f46; stroke-width: 1.5; marker-end: url(#a); }
      .w { fill: none; stroke: #d9480f; stroke-width: 1.6; marker-end: url(#o); }
    </style>
  </defs>

  <rect width="1200" height="560" rx="10" fill="#ffffff"/>

  <!-- zones -->
  <rect class="area" x="24" y="24" width="566" height="512" rx="8"/>
  <rect class="area" x="614" y="24" width="290" height="512" rx="8"/>
  <rect class="area" x="928" y="24" width="248" height="512" rx="8"/>
  <text class="zone" x="46" y="58">ON THE HAT</text>
  <text class="zone" x="636" y="58">IN THE CLOUD</text>
  <text class="zone" x="950" y="58">ON SITE</text>

  <!-- sensors -->
  <rect class="box" x="46" y="80" width="214" height="434" rx="6"/>
  <text class="t" x="66" y="112">Sensors</text>
  <text class="t" x="66" y="160">2× rear ultrasonic</text>
  <text class="s" x="66" y="180">objects closing in</text>
  <text class="t" x="66" y="232">Motion sensor</text>
  <text class="s" x="66" y="252">falls, head movement</text>
  <text class="t" x="66" y="304">Time-of-flight</text>
  <text class="s" x="66" y="324">hat on or off</text>
  <text class="t" x="66" y="376">Camera</text>
  <text class="s" x="66" y="396">rolling 30 s of video</text>
  <text class="t" x="66" y="448">Air sensor</text>
  <text class="s" x="66" y="468">CO₂, temperature, humidity</text>

  <!-- detection -->
  <rect class="key" x="322" y="214" width="246" height="92" rx="6"/>
  <text class="t" x="342" y="248">Detection</text>
  <text class="s" x="342" y="270">near misses, falls,</text>
  <text class="s" x="342" y="289">hat knocked off or removed</text>
  <path class="f" d="M260 260 H320"/>

  <!-- buzz -->
  <rect class="box" x="322" y="88" width="246" height="72" rx="6"/>
  <text class="t" x="342" y="118">Vibration motors</text>
  <text class="s" x="342" y="140">buzz on the side of the danger</text>
  <path class="w" d="M445 214 V162"/>
  <text class="l" x="455" y="192" style="fill:#d9480f">instant warning</text>

  <!-- bridge -->
  <rect class="box" x="322" y="368" width="246" height="92" rx="6"/>
  <text class="t" x="342" y="402">Upload queue</text>
  <text class="s" x="342" y="424">saved to the SD card, retried</text>
  <text class="s" x="342" y="443">until confirmed</text>
  <path class="f" d="M445 306 V366"/>
  <text class="l" x="455" y="342">event + clip</text>

  <!-- cloud -->
  <rect class="box" x="636" y="368" width="246" height="92" rx="6"/>
  <text class="t" x="656" y="402">Vercel + Supabase</text>
  <text class="s" x="656" y="424">device API, database,</text>
  <text class="s" x="656" y="443">video and sensor storage</text>
  <path class="f" d="M568 414 H634"/>
  <text class="l" x="581" y="404">Wi-Fi</text>

  <rect class="key" x="636" y="184" width="246" height="112" rx="6"/>
  <text class="t" x="656" y="218">AI report</text>
  <text class="s" x="656" y="241">Gemini watches the clip</text>
  <text class="s" x="656" y="261">Claude writes the draft from</text>
  <text class="s" x="656" y="280">the video and sensor data</text>
  <path class="f" d="M759 368 V298"/>

  <!-- site -->
  <rect class="box" x="950" y="184" width="204" height="112" rx="6"/>
  <text class="t" x="970" y="218">Dashboard</text>
  <text class="s" x="970" y="241">live incidents, video</text>
  <text class="s" x="970" y="261">synced to a sensor chart,</text>
  <text class="s" x="970" y="280">editable report</text>
  <path class="f" d="M882 240 H948"/>
  <text class="l" x="896" y="230">draft</text>

  <rect class="key" x="950" y="368" width="204" height="92" rx="6"/>
  <text class="t" x="970" y="402">Safety manager</text>
  <text class="s" x="970" y="424">reviews, edits and</text>
  <text class="s" x="970" y="443">signs off the report</text>
  <path class="f" d="M1052 296 V366"/>
</svg>
