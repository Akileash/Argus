[project]
name = "argus-device"
version = "0.1.0"
description = "Argus smart hard hat - Pi runtime (modular, hot-swappable)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
# Pi-only hardware libs. Imported lazily inside hardware/argus/* so laptops/CI never need them.
pi = [
  "smbus2>=0.4",
  "lgpio>=0.2",
  "gpiozero>=2.0",
  "adafruit-circuitpython-vl53l0x>=3.6",
  "adafruit-circuitpython-scd4x>=1.4",
]

[project.scripts]
argus-cli = "argus.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus", "hardware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = ["hardware: needs the real hat (skipped unless ARGUS_HARDWARE=1)"]

[tool.ruff]
line-length = 110
target-version = "py311"
