# Argus device config. Spec §5.3 (modules), §4 (thresholds), §4.4 (events).
# Switching hardware = change `impl` / `fallback`, then `argus-cli reload <module>`.
# impl: mock | replay | argus | team.   Example for the real hat:
#   imu: { impl: argus, fallback: team }
modules:
  imu:     { impl: mock }
  # MVP: 2 rear sensors, spec §3.2a. Add ids here to add sensors (reserved pins are in the spec, §2.3).
  range:   { impl: mock, options: { order: [R2, R3], slot_ms: 30 } }
  hat_on:  { impl: mock }
  env:     { impl: mock }
  haptics: { impl: mock }
  camera:  { impl: mock, options: { ring_s: 35 } }   # real camera: `ring_seconds` (>= 30); `ring_s` is accepted by both
  # camera.rear intentionally absent: the rear camera is out of scope (phase 2).

detectors:           # NOT swappable: only `argus` is accepted (anything else is a config error); tune `thresholds:`
  struck_by:   { impl: argus }
  fall_impact: { impl: argus }
  hat_state:   { impl: argus }

bus:
  history_s: 35

thresholds:          # names = what the detectors read (tests/unit/test_config_keys.py guards this)
  struck_by:   # spec §4.1
    range_min_m: 0.03
    range_max_m: 2.5
    track_len: 4
    min_track_samples: 3
    jump_m: 0.35
    first_step_max_rate_mps: 4.0
    handoff_tol_m: 0.2
    handoff_max_gap_s: 0.25
    track_timeout_s: 0.5
    rotation_gate_dps: 60.0
    trigger_range_m: 2.0
    v_obj_min_mps: 1.5
    ttc_max_s: 1.3
    confirm_sweeps: 2
    suppress_ego_ratio: 0.6
    suppress_v_obj_min_mps: 2.0
    ego_compensation: true
    ego_discount_only: true
    approach_gap_s: 1.0
    impact_g: 6.0   # same physical threshold as fall_impact.impact_g below: keep them equal unless deliberately tuned apart
    contact_window_s: 1.5
    saturation_g: 15.9
    haptic_hold_s: 0.3
    haptic_ttc_slow_s: 1.3
    haptic_slow_hz: 4.0
    haptic_ttc_continuous_s: 0.5
    haptic_fast_hz: 10.0
    ego_tau_s: 1.0
    zupt_window_s: 0.2
    zupt_var_thresh: 0.05
    zupt_mean_thresh: 0.4
    zupt_max_speed_mps: 0.5
    max_dt_s: 0.05
    madgwick_beta: 0.01
    accel_gate_g: 0.25
    calib_window_s: 2.0
    calib_gyro_motion_dps: 3.0
    calib_accel_motion_g: 0.05
  fall_impact:   # spec §4.2
    impact_g: 6.0   # must match struck_by.impact_g above unless deliberately tuned apart
    saturation_g: 15.9
    free_fall_g: 0.35
    free_fall_min_ms: 200.0
    landing_g: 3.0
    landing_window_ms: 1000.0
    pulse_end_g: 3.0
    pulse_hold_ms: 30.0
    max_pulse_ms: 500.0
    debounce_ms: 300.0
    ff_gap_tol_ms: 15.0
  hat_state:   # spec §4.3
    min_range_mm: 50.0
    max_range_mm: 1200.0
    baseline_max_mm: 120.0   # a stable reading farther than this is the table, not the head: it never calibrates.
                             # If the hat reads more than this on a real head, raise it (CONNECT-THE-HAT.md, step g).
    calibration_s: 3.0
    stable_spread_mm: 10.0
    off_delta_mm: 30.0
    on_band_mm: 15.0
    off_confirm_s: 3.0
    on_confirm_s: 2.0
    knock_lookback_s: 2.0
    knock_slack_ms: 100.0
    below_min_policy: clamp

events:                 # spec §4.4
  pre_roll_s: 20
  post_roll_s: 10
  merge_extend_max_s: 10
  cooldown_s: 5
  queue_dir: var/queue        # contracts/device_queue.md; relative paths resolve against device/
  queue_max_mb: 2048
  firmware_version: "0.1.0"

backend:                # blank on purpose; set by `argus-cli pair`
  base_url: ""
  device_token: ""
  timeout_s: 30         # per HTTP request
  max_backoff_s: 60     # uploader retry cap

device:
  serial: ""            # set by `argus-cli pair`
  status_led_pin: null  # 17 on the real hat: solid = calibrating, blinking = put the hat on, off = ready

bridge:                 # `argus-cli bridge run`: cloud bridge for the teammates' hat code (docs: argus/bridge/__init__.py)
  argus_dir: ~/argus    # THEIR tree. The bridge launches `python -m hat.main` there and only reads their files.
  python: ~/argus/.venv/bin/python
  launch: true          # false = only tail files (their hat.main is started by someone else)
  events_path: ""       # blank -> <argus_dir>/events.jsonl
  clips_dir: ""         # blank -> <argus_dir>/clips
  air_log: ~/argus/pi_sensors/logs/air_events.jsonl
  clip_wait_s: 45       # fall / line_of_fire wait this long for the clip, then go up without video
  air_max_age_s: 300    # newest air sample older than this is not attached
  knock_window_s: 2.0   # HELMET OFF within this after a fall = hat_knocked_off, otherwise hat_removed
  tof_off_dwell_s: 3.0  # their ToF prints OFF this long after the hat left the head
  side_sensor: { left: R2, right: R3 }   # NEEDS CONFIRMATION on the hat: their left/right -> our sensor_id
  state_dir: var/bridge # saved tail offset + staging for remuxed clips (relative paths resolve against device/)
