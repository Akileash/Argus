# Argus device config. Spec §5.3 (modules), §4 (thresholds), §4.4 (events).
# Switching hardware = change `impl` / `fallback`, then `argus-cli reload <module>`.
# impl: mock | replay | argus | team.   Example for the real hat:
#   imu: { impl: argus, fallback: team }
modules:
  imu:     { impl: mock }
  range:   { impl: mock }
  hat_on:  { impl: mock }
  env:     { impl: mock }
  haptics: { impl: mock }
  camera:  { impl: mock, options: { ring_s: 35 } }
  # camera.rear intentionally absent: the rear camera is out of scope (phase 2).

detectors:
  struck_by:   { impl: argus }
  fall_impact: { impl: argus }
  hat_state:   { impl: argus }

bus:
  history_s: 35

thresholds:
  struck_by:            # spec §4.1
    range_max_m: 2.0
    v_obj_min_mps: 1.5
    ttc_max_s: 1.3
    confirm_sweeps: 2
    rotation_gate_dps: 60
    suppress_ratio: 0.6
    suppress_v_obj_mps: 2.0
    track_len: 4
    track_jump_m: 0.35
    handoff_m: 0.2
    range_min_valid_m: 0.03
    range_max_valid_m: 2.5
    leaky_tau_s: 1.0
    zupt_ms: 200
    zupt_accel_var_g2: 0.0004
  fall_impact:          # spec §4.2
    impact_g: 6.0
    saturation_g: 16.0
    free_fall_g: 0.35
    free_fall_min_ms: 200
    post_fall_impact_g: 3.0
    post_fall_window_s: 1.0
    struck_by_upgrade_window_s: 1.5
  hat_state:            # spec §4.3
    off_delta_mm: 30
    off_hold_s: 3.0
    on_band_mm: 15
    on_hold_s: 2.0
    knocked_lookback_s: 2.0
    knocked_impulse_g: 3.0
    baseline_s: 3.0
    calibration_s: 2.0

events:                 # spec §4.4
  pre_roll_s: 20
  post_roll_s: 10
  merge_extend_max_s: 10
  cooldown_s: 5

backend:                # blank on purpose; set by `argus-cli pair`
  base_url: ""
  device_token: ""
